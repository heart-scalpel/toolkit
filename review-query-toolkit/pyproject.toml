[project]
name = "review-query-toolkit"
version = "0.1.0"
description = "Query, compare, and export human review CSV data."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]
ignore = ["RUF001"]

[tool.uv]
default-groups = ["dev"]
