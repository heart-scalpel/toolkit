name: output-collector-dev

services:
  collector:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: dev
      args:
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.11.1}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    init: true
    working_dir: /app/backend
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-3722}:8000"
    env_file: ../.env
    environment:
      COLLECTOR_ENVIRONMENT: development
      COLLECTOR_COOKIE_SECURE: "false"
      COLLECTOR_DATA_DIR: /app/backend/data
      UV_LINK_MODE: copy
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ../backend:/app/backend
      - ../index.html:/app/index.html:ro
      - ./dev-entrypoint.sh:/usr/local/bin/dev-entrypoint.sh:ro
      - collector-venv:/app/backend/.venv
      - collector-uv-cache:/root/.cache/uv
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    stop_grace_period: 15s

volumes:
  collector-venv:
  collector-uv-cache:
