name: output-collector-prod

services:
  collector:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: production
      args:
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.11.1}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    init: true
    working_dir: /app/backend
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-3722}:8000"
    env_file: ../.env
    environment:
      COLLECTOR_ENVIRONMENT: production
      COLLECTOR_DATA_DIR: /app/backend/data
    volumes:
      - ../backend/data:/app/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
